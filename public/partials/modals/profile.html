<!-- PROFILE MODAL -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal" style="width:400px">
    <div class="modal-title">Profile</div>

    <!-- Avatar preview + upload -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px">
      <div id="profile-avatar-preview" style="width:80px;height:80px;border-radius:50%;background:var(--green-dim);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green);overflow:hidden;cursor:pointer;position:relative" data-action="trigger-photo-upload">
        <span id="profile-avatar-initials">?</span>
        <img id="profile-avatar-img" style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0">
        <div class="avatar-photo-overlay" style="position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;border-radius:50%">
          <span style="font-size:18px">📷</span>
        </div>
      </div>
      <input type="file" id="profile-photo-input" accept="image/*" style="display:none">
      <div style="font-size:10px;color:var(--muted)">Click avatar to upload photo</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="form-group">
        <label class="form-label">Display Name</label>
        <input class="form-input" id="profile-name-input" placeholder="Your name" style="width:100%">
        <div id="profile-name-status" style="font-size:10px;min-height:14px;margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <div id="profile-email-display" style="font-family:var(--mono);font-size:12px;color:var(--muted);padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px">—</div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="close-modal" data-modal="profile-modal">Cancel</button>
      <button class="btn btn-primary" data-action="save-profile">Save Profile</button>
    </div>
  </div>
</div>
