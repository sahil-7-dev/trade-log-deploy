<!-- CLOSE TRADE MODAL -->
<div class="modal-overlay" id="close-trade-modal">
  <div class="modal" style="width:360px">
    <div class="modal-title">Close Trade</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px" id="close-trade-info"></div>
    <div class="form-group" style="margin-bottom:14px">
      <label class="form-label">Close</label>
      <select class="form-input" id="ct-mode" style="width:100%">
        <option value="full">Entire remaining position</option>
        <option value="partial">Part of the position</option>
      </select>
    </div>
    <div class="form-group" id="ct-amount-group" style="margin-bottom:14px;display:none">
      <label class="form-label">Amount to close ($ of position size)</label>
      <input class="form-input" type="number" placeholder="0.00" id="ct-amount" style="width:100%">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label class="form-label">Exit Price</label>
      <input class="form-input" type="number" placeholder="0.00" id="ct-exit" style="width:100%">
    </div>
    <div id="ct-preview" style="font-size:11px;color:var(--muted);margin-bottom:14px;font-family:var(--mono)"></div>
    <div class="form-group needs-db" style="margin-bottom:14px">
      <label class="form-label">Fee for this close ($)</label>
      <input class="form-input" type="number" placeholder="0.00" id="ct-fee" style="width:100%">
      <div id="ct-fee-hint" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label class="form-label">Exit Time</label>
      <input class="form-input" type="datetime-local" id="ct-date" style="width:100%">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="close-modal" data-modal="close-trade-modal">Cancel</button>
      <button class="btn btn-primary" id="close-trade-btn" data-action="close-trade-submit">Close Trade</button>
    </div>
    <input type="hidden" id="ct-trade-id">
  </div>
</div>
