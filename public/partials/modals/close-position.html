<!-- CLOSE POSITION MODAL -->
<div class="modal-overlay" id="close-position-modal">
  <div class="modal" style="width:420px">
    <div class="modal-title">Close Position</div>
    <div id="close-pos-info" style="background:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Exit Price ($)</label>
        <input class="form-input" type="number" placeholder="0.00" id="cp-exit-price">
      </div>
      <div class="form-group">
        <label class="form-label">Qty to Sell</label>
        <input class="form-input" type="number" placeholder="0.00" id="cp-qty">
      </div>
      <div class="form-group">
        <label class="form-label">Close Date</label>
        <input class="form-input" type="date" id="cp-date">
      </div>
      <div class="form-group">
        <label class="form-label">Close Type</label>
        <select class="form-select" id="cp-type">
          <option value="full">Full Close</option>
          <option value="partial">Partial Close</option>
        </select>
      </div>
    </div>
    <div id="cp-pnl-preview" style="margin-top:16px;background:var(--bg);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-family:var(--mono);font-size:11px">
      <div><div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Realized P&L</div><div id="cp-pnl-val" style="font-weight:700;font-size:14px">—</div></div>
      <div><div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Proceeds (USD)</div><div id="cp-proceeds-val" style="font-weight:700;font-size:14px">—</div></div>
      <div><div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Return %</div><div id="cp-ret-val" style="font-weight:700;font-size:14px">—</div></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="close-modal" data-modal="close-position-modal">Cancel</button>
      <button class="btn btn-primary" id="cp-submit-btn" data-action="submit-close-position">Close Position</button>
    </div>
    <input type="hidden" id="cp-holding-id">
  </div>
</div>
