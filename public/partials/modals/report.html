<!-- MONTHLY REPORT -->
<div class="modal-overlay" id="report-modal">
  <div class="modal" style="width:380px">
    <div class="modal-title">Monthly Report</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6">
      Opens your browser's print dialog — choose <strong>Save as PDF</strong> to keep a copy.
    </div>
    <div class="form-group">
      <label class="form-label">Month</label>
      <input class="form-input" type="month" id="report-month">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="close-modal" data-modal="report-modal">Cancel</button>
      <button class="btn btn-primary" data-action="print-report">Create report</button>
    </div>
  </div>
</div>
