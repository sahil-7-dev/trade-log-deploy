<!-- POSITION SIZE CALCULATOR -->
<div class="modal-overlay" id="calc-modal">
  <div class="modal" style="width:460px">
    <div class="modal-title">Position Size Calculator</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Account balance ($)</label>
        <input class="form-input" type="number" id="calc-balance">
      </div>
      <div class="form-group">
        <label class="form-label">Risk per trade (%)</label>
        <input class="form-input" type="number" id="calc-risk" step="0.1">
      </div>
      <div class="form-group">
        <label class="form-label">Entry price</label>
        <input class="form-input" type="number" id="calc-entry">
      </div>
      <div class="form-group">
        <label class="form-label">Stop loss</label>
        <input class="form-input" type="number" id="calc-sl">
      </div>
      <div class="form-group">
        <label class="form-label">Take profit <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input class="form-input" type="number" id="calc-tp">
      </div>
      <div class="form-group">
        <label class="form-label">Symbol <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input class="form-input" id="calc-symbol" placeholder="BTCUSDT">
      </div>
    </div>
    <div id="calc-result" class="calc-result"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="close-modal" data-modal="calc-modal">Close</button>
      <button class="btn btn-primary" data-action="calc-use">Log this trade →</button>
    </div>
  </div>
</div>
